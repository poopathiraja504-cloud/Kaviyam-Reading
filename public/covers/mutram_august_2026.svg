<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="35%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Spine / Background -->
  <rect width="400" height="580" rx="12" fill="#0f172a"/>
  
  <!-- Cover Base -->
  <rect x="12" y="6" width="382" height="568" rx="8" fill="#ffffff"/>
  
  <!-- Left Spine Shadow -->
  <rect x="12" y="6" width="22" height="568" rx="4" fill="#000" opacity="0.15"/>
  <line x1="34" y1="6" x2="34" y2="574" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Purple Banner -->
  <rect x="24" y="14" width="362" height="150" rx="6" fill="url(#gradPurple)"/>
  
  <text x="36" y="36" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">தமிழ்நாடு மகளிர் மேம்பாட்டு</text>
  <text x="372" y="36" fill="#fde047" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ஆகஸ்ட் (August) 2026</text>
  
  <text x="36" y="52" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="9.5">விலை ரூ. 20/- · ஊரக வளர்ச்சித் துறை</text>
  <text x="372" y="52" fill="#fde047" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">மலர்: 28 · இதழ்: 04</text>

  <!-- Big Title -->
  <text x="205" y="112" fill="url(#goldGrad2)" font-family="'Noto Sans Tamil', serif" font-size="44" font-weight="bold" text-anchor="middle" filter="url(#shadow2)">முற்றம்</text>
  <text x="205" y="134" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="1">மகளிர் சுய உதவிக் குழுக்களுக்கான மாத இதழ்</text>

  <!-- Announcement Focus Area -->
  <rect x="34" y="174" width="342" height="235" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  
  <rect x="44" y="185" width="322" height="38" rx="4" fill="#581c87"/>
  <text x="205" y="210" fill="#fef08a" font-family="'Noto Sans Tamil', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">மாண்புமிகு தமிழ்நாடு முதலமைச்சர் அறிவிப்பு</text>

  <text x="205" y="250" fill="#4c1d95" font-family="'Noto Sans Tamil', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">2026-2027ஆம் ஆண்டிற்கான மானியக் கோரிக்கையில்</text>

  <!-- Glowing Announcement Badge -->
  <rect x="42" y="270" width="326" height="70" rx="8" fill="#831843"/>
  <text x="205" y="298" fill="#fef08a" font-family="'Noto Sans Tamil', sans-serif" font-size="16.5" font-weight="bold" text-anchor="middle">மகளிர் மேம்பாட்டிற்கான</text>
  <text x="205" y="324" fill="#fbcfe8" font-family="'Noto Sans Tamil', sans-serif" font-size="16.5" font-weight="bold" text-anchor="middle">மகத்தான அறிவிப்புகள்!</text>

  <rect x="44" y="352" width="322" height="46" rx="4" fill="#f3e8ff"/>
  <text x="205" y="372" fill="#6b21a8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">சுதந்திர தின விழா 2026 &amp; போதை இல்லா தமிழ்நாடு உறுதிமொழி</text>
  <text x="205" y="388" fill="#7e22ce" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">தகைசால் தமிழர் மற்றும் முதலமைச்சரின் நல் ஆளுமை விருதுகள்</text>

  <!-- Bottom Highlights Strip -->
  <rect x="34" y="420" width="342" height="138" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
  <text x="46" y="442" fill="#9d174d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">★ இந்த இதழின் 15 பெரும் திட்டங்கள்:</text>
  
  <text x="46" y="462" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• ₹102 கோடி சமுதாய முதலீட்டு நிதி &amp; ₹20 கோடி சுழல் நிதி</text>
  <text x="46" y="480" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• 12,000 மகளிருக்கு AI செயற்கை நுண்ணறிவு தொழிற்பயிற்சி</text>
  <text x="46" y="498" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• ₹2 கோடி மதிப்பில் சுய உதவிக்குழு மின்வணிகத் தளம்</text>
  <text x="46" y="516" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• தஞ்சாவூர் தலையாட்டி பொம்மைகளால் தலைநிமிர்ந்த வாழ்வு</text>
  <text x="46" y="534" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• தென்காசி மண்பாண்டக் கலை &amp; தேனி இயற்கை பொருட்கள்</text>

  <!-- Golden Bookmark Ribbon -->
  <path d="M 345 6 L 375 6 L 375 55 L 360 44 L 345 55 Z" fill="#eab308"/>
</svg>
