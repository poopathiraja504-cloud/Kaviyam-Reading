<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="25%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Spine / Background -->
  <rect width="400" height="580" rx="12" fill="#0f172a"/>
  
  <!-- Cover Base -->
  <rect x="12" y="6" width="382" height="568" rx="8" fill="url(#cardGrad)"/>
  
  <!-- Left Spine Shadow -->
  <rect x="12" y="6" width="22" height="568" rx="4" fill="#000" opacity="0.15"/>
  <line x1="34" y1="6" x2="34" y2="574" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Crimson Banner -->
  <rect x="24" y="14" width="362" height="150" rx="6" fill="url(#gradRed)"/>
  
  <text x="36" y="36" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="600">தமிழ்நாடு மகளிர் மேம்பாட்டு</text>
  <text x="372" y="36" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ஜூலை (July) 2026</text>
  
  <text x="36" y="52" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="9.5">விலை ரூ. 20/- · ஊரக வளர்ச்சித் துறை</text>
  <text x="372" y="52" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">மலர்: 28 · இதழ்: 03</text>

  <!-- Big Title -->
  <text x="205" y="112" fill="url(#goldGrad)" font-family="'Noto Sans Tamil', serif" font-size="44" font-weight="bold" text-anchor="middle" filter="url(#shadow)">முற்றம்</text>
  <text x="205" y="134" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="1">மகளிர் சுய உதவிக் குழுக்களுக்கான மாத இதழ்</text>

  <!-- Middle Visual Area -->
  <rect x="34" y="174" width="342" height="230" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Emblem & Podium Styling -->
  <circle cx="205" cy="235" r="38" fill="#e2e8f0"/>
  <path d="M 185 240 Q 205 210 225 240 Z" fill="#475569"/>
  <circle cx="205" cy="225" r="14" fill="#64748b"/>
  <rect x="155" y="275" width="100" height="24" rx="4" fill="#1e293b"/>
  <text x="205" y="291" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">முதலமைச்சர்</text>

  <!-- Conference Label Box -->
  <rect x="42" y="315" width="326" height="75" rx="6" fill="#1e293b"/>
  <text x="205" y="342" fill="#fbbf24" font-family="'Noto Sans Tamil', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">மாவட்ட ஆட்சித் தலைவர்கள்,</text>
  <text x="205" y="364" fill="#f59e0b" font-family="'Noto Sans Tamil', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">காவல்துறை மற்றும் வனத்துறை</text>
  <text x="205" y="383" fill="#fef3c7" font-family="'Noto Sans Tamil', sans-serif" font-size="12" font-weight="600" text-anchor="middle">அதிகாரிகள் மாநில மாநாடு</text>

  <!-- Bottom Articles Strip -->
  <rect x="34" y="416" width="342" height="142" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="46" y="438" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">★ முக்கிய உள்ளடக்கங்கள்:</text>
  
  <text x="46" y="460" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• ஊரக வளர்ச்சி மற்றும் நீர்வளத்துறை ஆய்வுக் கூட்டம்</text>
  <text x="46" y="480" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• பிளாஸ்டிக்கைத் தவிர்ப்போம்... சுற்றுச்சூழலைக் காப்போம்</text>
  <text x="46" y="500" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• சட்டம்: பெண்களைக் கேலி செய்தல் தடை சட்டம் 1998</text>
  <text x="46" y="520" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• அன்னவாசல் காளான் வளர்ப்பு வாழ்வாதார வெற்றி</text>
  <text x="46" y="540" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• விருதுநகர் &amp; நாமக்கல் சுய உதவிக் குழு தயாரிப்புகள்</text>

  <!-- Golden Bookmark Ribbon on Top Right -->
  <path d="M 345 6 L 375 6 L 375 55 L 360 44 L 345 55 Z" fill="#f59e0b"/>
</svg>
