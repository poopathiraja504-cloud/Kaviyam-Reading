<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAVIYAM READING</title>
    <meta name="description" content="An elegant, full-featured Tamil novel reading platform with email authentication simulation, interactive voices, and AI-powered custom novel builder and reading companion." />
    <meta property="og:title" content="KAVIYAM READING" />
    <meta property="og:description" content="An elegant, full-featured Tamil novel reading platform with email authentication simulation, interactive voices, and AI-powered custom novel builder and reading companion." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- MSG91 SendOTP Web SDK -->
    <script type="text/javascript">
      var configuration = {
        widgetId: "36696b686a32393534303537",
        tokenAuth: "569585TgwZWLIDRVc6aa3b7bcP1",
        identifier: "",
        exposeMethods: true,
        success: (data) => {
            // get verified token in response
            console.log('success response', data);
            window.dispatchEvent(new CustomEvent('msg91-otp-success', { detail: data }));
        },
        failure: (error) => {
            // handle error
            console.log('failure reason', error);
            window.dispatchEvent(new CustomEvent('msg91-otp-failure', { detail: error }));
        },
      };
    </script>
    <script type="text/javascript">
      (function loadOtpScript(urls) {
          let i = 0;
          function attempt() {
              const s = document.createElement('script');
              s.src = urls[i];
              s.async = true;
              s.onload = () => {
                  if (typeof window.initSendOTP === 'function') {
                      window.initSendOTP(configuration);
                  }
              };
              s.onerror = () => {
                  i++;
                  if (i < urls.length) {
                      attempt();
                  }
              };
              document.head.appendChild(s);
          }
          attempt();
      })([
          'https://verify.msg91.com/otp-provider.js',
          'https://verify.phone91.com/otp-provider.js'
      ]);
    </script>
  </body>
</html>
